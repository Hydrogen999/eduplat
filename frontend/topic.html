<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Material — EduPlat NG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:"#eef7f2",100:"#d5ebdf",500:"#0f7a4a",600:"#0b6238",700:"#084c2b",900:"#04261a" },
            ink:   { 900:"#0f1f1a",700:"#2b3b35",500:"#556861" }
          }
        }
      }
    };
  </script>
  
  <!-- THIS IS THE MAGIC PDF LIBRARY -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Tell PDF.js where its background worker is
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    .watermark { 
      position: fixed; top: 50%; left: 50%; 
      transform: translate(-50%, -50%) rotate(-30deg); 
      font-size: 5rem; color: rgba(15, 122, 74, 0.05); 
      pointer-events: none; user-select: none; 
      font-weight: 800; white-space: nowrap; z-index: 0; 
    }
  </style>
</head>
<body class="bg-white min-h-screen">
  <div id="site-nav"></div>
  <div id="watermark-container"></div>

  <main class="max-w-3xl mx-auto px-4 py-10 relative z-10">
    <button onclick="history.back()" class="text-sm text-green-600 font-semibold mb-6">← Back to Topics</button>
    <h1 id="topic-title" class="text-3xl font-bold mb-8">Loading...</h1>
    <div id="content-area" class="space-y-6"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    requireAuth();
    renderNav();

    const topicId = new URLSearchParams(window.location.search).get("id");

    // This function draws the PDF onto the screen
    async function renderPdfToCanvas(url, containerId) {
      const container = document.getElementById(containerId);
      try {
        const loadingTask = pdfjsLib.getDocument(url);
        const pdf = await loadingTask.promise;
        
        // Limit to 15 pages so it doesn't freeze the phone
        const totalPages = Math.min(pdf.numPages, 15); 

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          // Scale 1.5 makes it sharp on phone screens
          const viewport = page.getViewport({ scale: 1.5 }); 
          
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          canvas.className = "w-full h-auto mb-4 rounded shadow border border-gray-200";
          
          await page.render({ canvasContext: context, viewport: viewport }).promise;
          container.appendChild(canvas);
        }
      } catch (error) {
        console.error("Error loading PDF:", error);
        container.innerHTML = `<p class="text-red-500">Failed to load PDF document.</p>`;
      }
    }

    async function loadContent() {
      try {
        const data = await apiCall(`/study/topics/${topicId}/content`);
        document.getElementById("topic-title").textContent = data.title;
        
        // Add watermark
        document.getElementById("watermark-container").innerHTML = `<div class="watermark">${data.watermark}</div>`;

        const area = document.getElementById("content-area");
        area.innerHTML = "";

        const blocks = data.blocks.blocks || [];
        
        blocks.forEach(block => {
          // We only render the PDF block if it exists
          if (block.type === "pdf" && block.url) {
            const pdfId = "pdf-container-" + Math.floor(Math.random() * 10000);
            const div = document.createElement("div");
            div.className = "p-4 bg-gray-50 rounded-xl border border-gray-100 flex flex-col items-center";
            div.innerHTML = `
              <h3 class="font-bold mb-4 text-green-800 self-start">Study Document</h3>
              <div id="${pdfId}" class="w-full flex flex-col items-center"></div>
              <p class="text-xs text-center text-gray-400 mt-4">This document is protected. Downloading is disabled.</p>
            `;
            area.appendChild(div);
            
            // Call the renderer
            renderPdfToCanvas(block.url, pdfId);
          } else if (block.type !== "pdf") {
            // Render normal text blocks (in case you add them later)
            const div = document.createElement("div");
            div.className = "p-5 bg-gray-50 rounded-xl border border-gray-100";
            
            if (block.type === "intro" || block.type === "summary") {
              div.innerHTML = `<p class="text-lg font-medium whitespace-pre-wrap">${escapeHtml(block.text)}</p>`;
            } else if (block.type === "objectives") {
              div.innerHTML = `<h3 class="font-bold mb-2">Learning Objectives</h3>
                <ul class="list-disc pl-5 space-y-1 text-gray-700 whitespace-pre-wrap">${block.items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`;
            } else if (block.type === "explanation") {
              div.innerHTML = `<p class="text-gray-700 leading-relaxed whitespace-pre-wrap">${escapeHtml(block.text)}</p>`;
            }
            
            if (div.innerHTML.trim() !== "") {
              area.appendChild(div);
            }
          }
        });
      } catch (err) {
        document.getElementById("topic-title").textContent = "Error";
        document.getElementById("content-area").innerHTML = `<p class="text-red-500">${err.message}</p>`;
      }
    }

    if (topicId) loadContent(); else window.location.href = "/study.html";
  </script>
</body>
</html>
