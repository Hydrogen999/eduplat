<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verifying payment… — EduPlat NG</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 text-center shadow-xl ring-1 ring-slate-100">
    <div id="spinner" class="mx-auto h-10 w-10 animate-spin rounded-full border-4 border-brand-500 border-t-transparent"></div>
    <h1 id="title" class="mt-6 font-bold text-xl">Verifying your payment…</h1>
    <p id="message" class="mt-2 text-ink-500 text-sm">Please wait a moment.</p>
  </div>

   <script src="/js/api.js"></script>
  <script>
  (async () => {
    const params = new URLSearchParams(window.location.search);
    const ref = params.get("ref") || params.get("reference");
    if (!ref) { document.getElementById("title").textContent = "No payment reference found."; return; }

    try {
      const result = await apiCall(`/payments/verify/${ref}`);
      document.getElementById("spinner").classList.add("hidden");
      document.getElementById("title").textContent = "Payment successful ✅";
      document.getElementById("message").textContent = "Redirecting...";
      
      // THIS IS THE FIX: Check what they bought!
      setTimeout(() => {
        if (result.kind === "exam") {
          // If it's an exam, go straight to the CBT screen!
          window.location.href = `/exam-session.html?attempt=${result.target_id}`;
        } else {
          // If it's a topic, go back to the dashboard
          window.location.href = "/dashboard.html";
        }
      }, 1500);
      
    } catch (e) {
      document.getElementById("spinner").classList.add("hidden");
      document.getElementById("title").textContent = "Payment could not be verified";
      document.getElementById("message").textContent = e.message;
    }
  })();
  </script>
