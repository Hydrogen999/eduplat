<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — EduPlat NG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl ring-1 ring-slate-100">
    <a href="/" class="flex items-center gap-2">
      <div class="grid h-9 w-9 place-items-center rounded-lg bg-brand-500 font-bold text-white">E</div>
      <span class="font-display text-lg font-bold">EduPlat<span class="text-brand-500">NG</span></span>
    </a>
    <h1 class="mt-6 font-display text-2xl font-bold">Welcome back</h1>
    <p class="mt-1 text-sm text-ink-500">Sign in to continue your learning.</p>

    <form id="login-form" class="mt-6 space-y-4">
      <div>
        <label class="text-sm font-medium">Email</label>
        <input name="email" type="email" required autocomplete="email"
               class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 focus:border-brand-500 focus:outline-none" />
      </div>
      <div>
        <label class="text-sm font-medium">Password</label>
        <input name="password" type="password" required autocomplete="current-password"
               class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 focus:border-brand-500 focus:outline-none" />
      </div>
      <button type="submit" class="w-full rounded-lg bg-brand-500 py-2.5 font-semibold text-white hover:bg-brand-600">
        Sign in
      </button>
      <p id="err" class="hidden rounded-lg bg-red-50 p-3 text-sm text-red-700"></p>
    </form>

    <div class="mt-6 flex items-center justify-between text-sm">
      <a href="/reset-password.html" class="text-ink-700 hover:text-brand-600">Forgot password?</a>
      <a href="/register.html" class="font-semibold text-brand-600 hover:text-brand-700">Create account</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const errEl = document.getElementById("err");
      errEl.classList.add("hidden");
      const btn = form.querySelector("button[type=submit]");
      btn.disabled = true; btn.textContent = "Signing in…";
      try {
        const data = await apiCall("/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: form.email.value.trim(),
            password: form.password.value,
          }),
        });
        auth.setAccess(data.access_token);
        auth.setUser(data.user);
        window.location.href = "/dashboard.html";
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove("hidden");
      } finally {
        btn.disabled = false; btn.textContent = "Sign in";
      }
    });
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { 50:"#eef7f2",100:"#d5ebdf",500:"#0f7a4a",600:"#0b6238",700:"#084c2b",900:"#04261a" },
          ink:   { 900:"#0f1f1a",700:"#2b3b35",500:"#556861" }
        }
      }
    }
  };
</script>
</body>
</html>
